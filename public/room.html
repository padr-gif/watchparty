<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Комната — WatchParty</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><a href="/" style="text-decoration:none">Watch<span>Party</span></a></h1>
    <b id="title"></b>
    <button id="copy" style="margin-left:auto">Скопировать ссылку</button>
  </header>
  <div class="room">
    <div class="stage" id="stage"></div>
    <div class="side">
      <div class="panel users" id="users"></div>
      <div class="panel row">
        <input id="url" style="flex:1" placeholder="Сменить видео: ссылка">
        <button id="setUrl">OK</button>
      </div>
      <div class="panel" id="chat"></div>
      <div class="panel row">
        <input id="msg" style="flex:1" placeholder="Сообщение…" maxlength="500">
        <button id="send">➤</button>
      </div>
    </div>
  </div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="/room.js"></script>
<script src="/tvnav.js"></script>
</body>
</html>
